<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Trading Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
  <div class="header">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="title">AI COPILOT</span>
    </div>
    <span class="badge" id="modeBadge">PAPER</span>
  </div>

  <div class="status-card">
    <div class="metric-row">
      <span class="label">Balance:</span>
      <strong id="balanceVal">₹100,000.00</strong>
    </div>
    <div class="metric-row">
      <span class="label">Regime:</span>
      <span id="regimeVal" class="regime-text">DETECTING...</span>
    </div>
    <div class="metric-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); align-items: center; justify-content: space-between;">
      <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; cursor: pointer; color: #a78bfa; font-weight: 600;">
        <input type="checkbox" id="popupCheckAutoPaper"> Auto Paper Exec
      </label>
      <button id="popupBtnPauseEntries" class="btn btn-sm btn-outline" style="font-size: 10px; padding: 2px 6px;">⏸️ Pause</button>
    </div>
  </div>

  <div class="symbol-box">
    <span class="label">Active Symbol & Timeframe:</span>
    <div class="symbol-input-group">
      <input type="text" id="symbolInput" value="NSE:NIFTY1!" class="symbol-input">
      <select id="intervalSelect" class="symbol-input" style="width: 65px; padding: 4px;">
        <option value="1m">1m</option>
        <option value="5m">5m</option>
        <option value="15m" selected>15m</option>
        <option value="30m">30m</option>
        <option value="60m">1h</option>
        <option value="1d">1D</option>
      </select>
      <button id="btnSyncTab" class="btn btn-sm btn-outline" title="Sync from TradingView Tab">🔄 Tab</button>
    </div>
    <div id="syncStatus" class="sync-status" style="display: none; font-size: 10px; color: #8b949e; line-height: 1.2; margin-top: 3px;"></div>
  </div>

  <div class="actions">
    <button id="btnAnalyze" class="btn btn-primary btn-block">⚡ Analyze Setup (3:1 R:R)</button>
  </div>

  <div id="signalContainer" class="ticket-card" style="display: none;">
    <div class="ticket-header">
      <span class="badge" id="decisionBadge">TRADE</span>
      <span id="strategyName" class="strategy-label">TrendFollowing</span>
    </div>
    <div class="ticket-details">
      <div class="detail-row"><span>Entry:</span> <strong id="tEntry">₹0.00</strong></div>
      <div class="detail-row"><span>Stop Loss:</span> <strong id="tSL" class="text-danger">₹0.00</strong></div>
      <div class="detail-row"><span>Take Profit:</span> <strong id="tTP" class="text-success">₹0.00</strong></div>
      <div class="detail-row"><span>Net R:R:</span> <strong id="tRR" class="text-accent">3.20 R</strong></div>
      <div class="detail-row"><span>Quantity:</span> <strong id="tQty">0</strong></div>
    </div>
    <div id="reasonsBox" class="reasons-box" style="display: none;"></div>
    <button id="btnExecute" class="btn btn-success btn-block" style="margin-top: 8px;">🚀 Execute Order</button>
  </div>

  <div class="footer-actions">
    <a href="http://127.0.0.1:8765/" target="_blank" class="btn btn-secondary btn-sm">Open Dashboard</a>
    <button id="btnEmergencyStop" class="btn btn-danger btn-sm">🛑 Kill Switch</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
